dependency_overrides:
  thermion_dart:
    git:
      url: https://github.com/nmfisher/thermion.git
      ref: d10b1a891df324a17c772e5f73c382e98b3e2a06
      path: thermion_dart
  thermion_flutter:
    git:
      url: https://github.com/nmfisher/thermion.git
      ref: d10b1a891df324a17c772e5f73c382e98b3e2a06
      path: thermion_flutter/thermion_flutter

dev_dependencies:
