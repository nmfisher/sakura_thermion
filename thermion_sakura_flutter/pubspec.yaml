publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.2.0
  vector_math: ^2.1.4
  thermion_dart:
    git:
      url: https://github.com/nmfisher/thermion.git
      ref: d10b1a891df324a17c772e5f73c382e98b3e2a06
      path: thermion_dart
  thermion_flutter:
    git:
      url: https://github.com/nmfisher/thermion.git
      ref: d10b1a891df324a17c772e5f73c382e98b3e2a06
