name: thermion_sakura
description: Sakura Crossing — a Japanese suburban railway-crossing street, cel-shaded, re-implemented in Dart + Thermion + HTML + CSS.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.3.0

dependencies:
  thermion_dart:
    git:
      url: https://github.com/nmfisher/thermion.git
      ref: d10b1a891df324a17c772e5f73c382e98b3e2a06
      path: thermion_dart
  logging: ^1.3.0
  web: ^1.0.0
  vector_math: ^2.1.2

# Web-only package. `skip_native_build` lets us run Thermion's pure-Dart
# tooling (notably `dart run thermion_dart:download_web`, which fetches the
# prebuilt web artifacts over HTTP) without firing a host C++ build. The web
# build itself still downloads its artifacts in the buildCodeAssets branch.
hooks:
  user_defines:
    thermion_dart:
      skip_native_build: true
